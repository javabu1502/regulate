<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111d35"/>
      <stop offset="100%" stop-color="#0b1526"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#2a6b6e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2a6b6e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Teal glow -->
  <circle cx="256" cy="240" r="180" fill="url(#glow)"/>
  <!-- Nervous system (vagus nerve) mark, from WaveIcon in src/components/Icons.tsx -->
  <g transform="translate(88,88) scale(14)" fill="none" stroke="#6ec4c7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Brainstem -->
    <ellipse cx="12" cy="2.5" rx="2" ry="1.2" stroke-width="1"/>
    <!-- Left vagus trunk -->
    <path d="M10.5 3.5C9.5 5.5 10.5 7.5 10 10C9.5 12.5 10.5 15 10 17.5C9.7 19 10 21 10 22" stroke-width="1.3"/>
    <!-- Right vagus trunk -->
    <path d="M13.5 3.5C14.5 5.5 13.5 7.5 14 10C14.5 12.5 13.5 15 14 17.5C14.3 19 14 21 14 22" stroke-width="1.3"/>
    <!-- Branch to heart -->
    <path d="M10.2 8.5C8.5 9 7 10 6 11" opacity="0.45" stroke-width="1"/>
    <!-- Branch to lungs -->
    <path d="M13.8 8.5C15.5 9 17 10 18 11" opacity="0.45" stroke-width="1"/>
    <!-- Branches to gut -->
    <path d="M10.2 15C8.5 15.5 7.5 16.5 7 17.5" opacity="0.3" stroke-width="1"/>
    <path d="M13.8 15C15.5 15.5 16.5 16.5 17 17.5" opacity="0.3" stroke-width="1"/>
  </g>
</svg>
