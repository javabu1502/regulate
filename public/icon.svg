      <ellipse cx="12" cy="2.5" rx="2" ry="1.2" stroke-width="1.05"/>
      <path d="M10.5 3.5C9.5 5.5 10.5 7.5 10 10C9.5 12.5 10.5 15 10 17.5C9.7 19 10 21 10 22" stroke-width="1.3"/>
