<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="76%">
      <stop offset="0%" stop-color="#16263f"/>
      <stop offset="58%" stop-color="#0c1526"/>
      <stop offset="100%" stop-color="#060b17"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ec4c7" stop-opacity="0.30"/>
      <stop offset="42%" stop-color="#4f9ea8" stop-opacity="0.12"/>
